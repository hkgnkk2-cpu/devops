version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Test the greeting program
          command: |
            output=$(printf "CircleCI\n" | python hello.py)
            printf '%s\n' "$output"
            expected=$(printf '%s\n' \
              "Hello, CircleCI! Your Git basics demo is working." \
              "This is a new line added to the code.")
            test "$output" = "$expected"

workflows:
  test-on-push:
    jobs:
      - test
